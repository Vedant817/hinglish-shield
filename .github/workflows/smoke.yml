name: Pipeline integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest nbformat auditkit==1.1.3 curatorkit==0.1.21
      - run: make smoke PYTHON=python
      - run: python -m pytest tests/ -q
      - name: Verify local payload-preservation fixtures
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          fixture = Path('tests/fixtures/curatorkit_safety_payload')
          before = subprocess.run([sys.executable, str(fixture / 'run_fixture.py'), 'default'])
          assert before.returncode == 1
          assert json.loads((fixture / 'evidence/default.json').read_text())['label_invalidated'] > 0
          subprocess.run([sys.executable, str(fixture / 'run_fixture.py'), 'patched'], check=True)
          assert json.loads((fixture / 'evidence/patched.json').read_text())['label_invalidated'] == 0
          PY
      - run: make check-family-splits-translations PYTHON=python
      - name: Validate unexecuted notebook
        run: |
          python - <<'PY'
          import ast
          import nbformat
          n = nbformat.read('notebooks/gpu_parity_and_baseline.ipynb', as_version=4)
          nbformat.validate(n)
          for c in n.cells:
              if c.cell_type == 'code':
                  ast.parse(c.source)
                  assert not c.outputs and c.execution_count is None
          PY
