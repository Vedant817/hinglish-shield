name: Pipeline integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest nbformat auditkit==1.1.3
      - run: make smoke PYTHON=python
      - run: python -m pytest tests/ -q
      - run: make check-family-splits-translations PYTHON=python
      - name: Validate unexecuted notebook
        run: |
          python - <<'PY'
          import ast
          import nbformat
          n = nbformat.read('notebooks/gpu_parity_and_baseline.ipynb', as_version=4)
          nbformat.validate(n)
          for c in n.cells:
              if c.cell_type == 'code':
                  ast.parse(c.source)
                  assert not c.outputs and c.execution_count is None
          PY
