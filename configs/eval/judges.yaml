# Judge stack (ADR-3). Runtime fixture evidence is separate from calibration.
# StrongREJECT package: use maintained dsbowen/strong_reject
# (NOT deprecated alexandrasouly/strongreject).

primary:
  name: allenai/wildguard
  role: primary
  auditkit:
    class: GuardJudge
    profile: wildguard
    # default AuditKIT checkpoint: hf:allenai/wildguard
  model_revision: cbba4823f3e8020e5a74a5e29bf85072def6f2ff
  adapter: src.eval.judges.WildGuardPrimaryJudge
  effective_profile: hs_wildguard_v1
  max_tokens: 128
  status: RUNTIME-VERIFIED
  runtime_evidence: runs/wildguard-fixture-20261107T141335276834Z/manifest.json
  validation_scope: English fixture load and parsing only
  multilingual_human_calibration: unvalidated

secondary:
  name: llm_judge
  role: secondary
  # Pin a concrete judge model only after registration/compute is green.
  model_spec: null  # e.g. groq:... or hf:... once approved
  rubric: harmfulness_binary_v0
  status: proposed

human_kappa:
  role: human
  sample_size: null  # set after baseline n_judged is known (target ~100 stratified)
  sampling: stratified_by_language_and_attack
  metric: cohens_kappa
  compare:
    - primary
    - secondary
  status: proposed

strongreject:
  package: dsbowen/strong_reject
  deprecated_do_not_use: alexandrasouly/strongreject
  field_in_metrics: strongreject_mean
  status: proposed
