# Locked test-split eval for H1 primary (single shot). NOT for Nov 8.
# Nov 8 preliminary H1 uses configs/eval/baseline.yaml on split=dev only.
# This file is the Nov 11 frozen-test pass: base + refuse-everything control
# + frozen repair, same harness / judges / seeds. Never used for selection.
#
# Harness guard (src/eval/run_baseline.py):
#   --config configs/eval/test_locked.yaml
#   --split test
#   --i-understand-single-shot
# Requires non-null dataset_hash and a frozen split manifest. Refuses if a
# prior test run record or atomic attempt reservation already exists under runs/.
# The canonical checkout shares runs/_locked_test_attempt.json across run ids.
# Never delete that marker to retry. CLI remains a non-scoring stub.

project: hinglish-shield
status: locked_test_pending  # not runnable until partitions freeze + Repair arm frozen
role: h1_primary_single_shot
build_plan_timing: "Nov 11 IST evaluate frozen test once (agreed with ML Research Lead)"
selection_policy: never_use_for_selection_or_tuning

# Guard enforces the IST embargo independently of configurable fields.
# Pin the exact bytes of a verified real repair freeze before test admission.
frozen_repair:
  manifest: runs/gpu-20261110-011925-83c016e0/repair_freeze.json
  sha256: 6fc30b183cd5e89676b6cf403646a4c54f567af408fe51d1563ad7cf4a6dbf88

model_id: CohereLabs/tiny-aya-global
model_revision: af89d219b53ed9b13b8a4645f9c8028973510324
seed: 42
splits: [test]

datasets:
  hs_harm_en: data/curated/hs_harm_en/test/*.jsonl
  hs_benign_en: data/curated/hs_benign_en/test/*.jsonl
  hs_harm_hi: data/curated/hs_harm_hi/test/*.jsonl
  hs_harm_hinglish: data/curated/hs_harm_hinglish/test/*.jsonl
  dataset_hash: 334e7151edfd9fe958afcded67417b9315d2d26b693b51f91b998c5d9638b531
  split_manifest: data/splits/family_splits_v2.json
  split_manifest_sha256: 334e7151edfd9fe958afcded67417b9315d2d26b693b51f91b998c5d9638b531

judges_config: configs/eval/judges.yaml

method_arms:
  - base
  - refuse_everything   # control baseline family; random baseline not preregistered
  - frozen_repair       # pinned after 2026-11-10 repair freeze

controls:
  refuse_everything:
    family: control_baseline
    selection_eligible: false
    # Pass if harmful_reduction_oracle beats this on dev (dev only); never a selection target on test.
    scoring: "non_selection_control"

attacks:
  - direct

generation:
  # Fill at runtime for the frozen pass; DO NOT tune on test.
  max_new_tokens: 256
  temperature: 0.0
  do_sample: false

metrics:
  - asr
  - strongreject_mean
  - over_refusal
  - capability
  - language_gap

uncertainty:
  proportion_ci: wilson
  proportion_ci_level: 0.95
  gap_bootstrap: paired_family_cluster
  gap_bootstrap_replicates: 2000
  gap_bootstrap_seed: 20261106
  gap_ci_level: 0.95

outputs:
  require_runs_dir: true
  write_null_if_unknown: true
